<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mr. Hachalu | Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #070D0B; color: #F4F6F5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .admin-card { background: rgba(15, 28, 22, 0.95); border: 1px solid #D4AF37; padding: 40px; border-radius: 16px; max-width: 600px; width: 100%; box-shadow: 0 15px 35px rgba(0,0,0,0.8); }
        h2 { font-family: 'Playfair Display', serif; color: #F3E5AB; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0 15px 0; background: #050A08; border: 1px solid rgba(212,175,55,0.3); color: #FFF; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: linear-gradient(135deg, #D4AF37, #997A15); border: none; font-weight: 700; color: #070D0B; border-radius: 6px; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; text-align: center; }
        .box { background: rgba(5,10,8,0.8); padding: 15px; border-radius: 8px; border: 1px solid rgba(212,175,55,0.2); }
        .val { font-size: 1.4rem; font-weight: bold; color: #F3E5AB; }
    </style>
</head>
<body>
    <div class="admin-card">
        <h2>Mr. Hachalu Administration Portal</h2>
        
        <div id="loginSec">
            <form id="lForm">
                <label>Username</label>
                <input type="text" id="u" placeholder="Enter username" required>
                <label>Password</label>
                <input type="password" id="p" placeholder="Enter password" required>
                <button type="submit">Login to Dashboard</button>
            </form>
        </div>

        <div id="dashSec" style="display:none;">
            <p>Welcome, System Administrator Mr. Hachalu</p>
            <div class="grid">
                <div class="box">Donors<div class="val" id="dNum">0</div></div>
                <div class="box">Recipients<div class="val" id="rNum">0</div></div>
                <div class="box">Cash (ETB)<div class="val" id="cNum">0</div></div>
            </div>
            <button onclick="logout()" style="margin-top:20px; background: #c0392b; color:#fff;">Logout</button>
        </div>
    </div>

    <script>
        const tok = localStorage.getItem('h_token');
        if (tok) loadDash();

        document.getElementById('lForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value })
            });
            const data = await res.json();
            if (data.success) {
                localStorage.setItem('h_token', data.token);
                loadDash();
            } else { alert(data.error); }
        });

        async function loadDash() {
            const res = await fetch('/api/admin/dashboard', {
                headers: { 'Authorization': `Bearer ${localStorage.getItem('h_token')}` }
            });
            if (!res.ok) return logout();
            const data = await res.json();
            document.getElementById('dNum').innerText = data.totalDonors;
            document.getElementById('rNum').innerText = data.totalRecipients;
            document.getElementById('cNum').innerText = data.totalCashETB;
            document.getElementById('loginSec').style.display = 'none';
            document.getElementById('dashSec').style.display = 'block';
        }

        function logout() {
            localStorage.removeItem('h_token');
            document.getElementById('loginSec').style.display = 'block';
            document.getElementById('dashSec').style.display = 'none';
        }
    </script>
</body>
</html>
