<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Hachalu | Secure Admin Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #070D0B; color: #F4F6F5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background: rgba(15, 28, 22, 0.95); border: 1px solid #D4AF37; padding: 30px; border-radius: 12px; max-width: 500px; width: 90%; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #050A08; border: 1px solid rgba(212,175,55,0.3); color: #FFF; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #D4AF37; color: #070D0B; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 20px; }
        .stat-card { background: #050A08; border: 1px solid rgba(212,175,55,0.3); padding: 10px; border-radius: 6px; }
        .stat-num { font-size: 1.4rem; color: #F3E5AB; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Mr. Hachalu Admin Login</h2>
        <div id="loginView">
            <form id="adminForm">
                <input type="text" id="user" placeholder="Username" required>
                <input type="password" id="pass" placeholder="Password" required>
                <button type="submit">Log In</button>
            </form>
        </div>

        <div id="dashboardView" style="display: none;">
            <p style="color: #F3E5AB;">Authenticated System Access</p>
            <div class="stat-grid">
                <div class="stat-card"><div>Donors</div><div class="stat-num" id="dCount">0</div></div>
                <div class="stat-card"><div>Recipients</div><div class="stat-num" id="rCount">0</div></div>
                <div class="stat-card"><div>Cash</div><div class="stat-num" id="cTotal">0 ETB</div></div>
            </div>
            <button onclick="logout()" style="margin-top:20px; background:#cc3333; color:#FFF;">Log Out</button>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('adminToken');
        if (token) loadDashboard();

        document.getElementById('adminForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: document.getElementById('user').value, password: document.getElementById('pass').value })
            });
            const data = await res.json();
            if (data.success) {
                localStorage.setItem('adminToken', data.token);
                loadDashboard();
            } else {
                alert(data.error);
            }
        });

        async function loadDashboard() {
            const activeToken = localStorage.getItem('adminToken');
            const res = await fetch('/api/admin/dashboard', { headers: { 'Authorization': `Bearer ${activeToken}` } });
            if (!res.ok) return logout();
            const data = await res.json();
            document.getElementById('loginView').style.display = 'none';
            document.getElementById('dashboardView').style.display = 'block';
            document.getElementById('dCount').innerText = data.totalDonors;
            document.getElementById('rCount').innerText = data.totalRecipients;
            document.getElementById('cTotal').innerText = `${data.totalCashETB} ETB`;
        }

        function logout() {
            localStorage.removeItem('adminToken');
            location.reload();
        }
    </script>
</body>
</html>
